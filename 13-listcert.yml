- name: Get list of certificates from RACF
  hosts: zos_host
  gather_facts: false
  environment: "{{ environment_vars }}"
  vars:
    cert_type: "CERTAUTH"
    cert_label: "VSICA"
    owner_id: "" # Only required if cert_type is USER

  tasks:
    - name: List cert, print results whether it exists or not.
      block:
        - name: 'Displaying cert {{ cert_label }}.'
          vars:
            format_cert_type: "{{ 'ID(' + owner_id + ')' if cert_type == 'USER' else cert_type }}"
          ansible.builtin.command:
            cmd: tsocmd "RACDCERT {{ format_cert_type }} LIST(LABEL('{{ cert_label }}'))"
          register: list_cert
          changed_when: false

      always:
        - name: Print results from list cert command.
          ansible.builtin.debug:
            var: list_cert.stdout_lines
