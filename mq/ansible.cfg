[defaults]
# Ansible Configuration for z/OS Operations
remote_tmp = /tmp
callback_result_format = yaml 

# Inventory file location
inventory = ./inventory.yml

# Disable host key checking (use with caution in production)
host_key_checking = False

# Number of parallel processes
forks = 5

# Timeout for connections
timeout = 30

#callbacks_enabled = profile_tasks

# Retry files
retry_files_enabled = False

# Gathering facts
gathering = explicit

[inventory]
# Enable inventory plugins
enable_plugins = yaml, ini, host_list

[privilege_escalation]
become = False

[ssh_connection]
# SSH connection settings
ssh_args = -C -o ControlMaster=auto -o ControlPersist=1200s -o PreferredAuthentications=publickey -o ForwardAgent=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining = True
control_path = %(directory)s/%%h-%%r

[colors]
# Colorize output
highlight = white
verbose = blue
warn = bright purple
error = red
debug = dark gray
deprecate = purple
skip = cyan
unreachable = red
ok = green
changed = yellow
